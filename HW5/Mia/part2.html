<html>
  <body>
    <!-- // Part 1: Display all users in table -->

    <h2>用户列表</h2>
    <table id="usersTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>姓名</th>
          <th>用户名</th>
          <th>邮箱</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <div id="error"></div>

    <script>
      async function loadUsers() {
        try {
          const res = await fetch("https://jsonplaceholder.typicode.com/users");
          if (!res.ok) {
            throw new Error("请求失败，状态码：" + res.status);
          }
          const users = await res.json();

          const tbody = document.querySelector("#usersTable tbody");
          //           这里是一个选择器，意思是：
          // 找到 id 为 usersTable 的元素
          // 然后在它里面找到 tbody
          users.forEach((user) => {
            const row = `
            <tr>
              <td>${user.id}</td>
              <td>${user.name}</td>
              <td>${user.username}</td>
              <td>${user.email}</td>
            </tr>
          `;
            tbody.insertAdjacentHTML("beforeend", row);
          });
        } catch (err) {
          document.getElementById("error").textContent =
            "加载用户失败: " + err.message;
        }
      }

      loadUsers();
    </script>
  </body>
</html>
