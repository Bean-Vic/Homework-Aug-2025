<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Counter</title>
    <script src="OA.js"></script>
    <link
      href="https://fonts.googleapis.com/css?family=Raleway:400,700"
      rel="stylesheet"
    />
    <link rel="stylesheet" type="text/css" href="style.css" />
  </head>
  <body>
    <div>
      <textarea
        id="text"
        rows="4"
        cols="50"
        placeholder="Please put your text here"
      >
This is a sample text. You can replace this with any text of your choice.
    </textarea
      >

      <p>Find: <input class="find" type="text" /></p>
      <p>Replace with: <input class="replace" type="text" /></p>
      <p><button type="button" id="replace-btn">Replace</button></p>
    </div>

    <script>
      // 动态加载外部 script.js，避免缓存
      let random = Math.random();
      let s = document.createElement("script");
      s.type = "text/javascript";
      s.src = "script.js?ts=" + random;
      document.getElementsByTagName("head")[0].appendChild(s);

      // 延迟执行初始化函数
      setTimeout(function () {
        if (
          window.replacer &&
          typeof window.replacer.initReplacer === "function"
        ) {
          window.replacer.initReplacer();
        }
      }, 1500);
    </script>
  </body>
</html>
