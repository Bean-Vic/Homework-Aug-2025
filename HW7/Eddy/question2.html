<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Random Dog</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{--b:#e5e7eb;--g:#f7f7f7;--tx:#111827}
  *{box-sizing:border-box}
  body{font-family:Arial,Helvetica,sans-serif;color:var(--tx);margin:0;padding:32px;background:#fff}
  .wrap{max-width:720px;margin:0 auto}
  .card{border:1px solid var(--b);border-radius:12px;background:var(--g);padding:18px;display:grid;gap:12px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  button{height:36px;padding:0 12px;border:1px solid var(--b);border-radius:8px;background:#eee;cursor:pointer}
  button:disabled{opacity:.6;cursor:not-allowed}
  .img{width:100%;max-height:520px;object-fit:contain;border:1px solid var(--b);border-radius:8px;background:#fff}
  .mut{color:#6b7280}
  .err{color:#b91c1c}
  .link{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect}=React
function App(){
  const [img,setImg]=useState("")
  const [href,setHref]=useState("")
  const [loading,setLoading]=useState(false)
  const url="https://dog.ceo/api/breeds/image/random"
  const load=async()=>{
    setHref("")
    setLoading(true)
    try{
      const r=await fetch(url)
      const d=await r.json()
      const raw=d&&d.message?String(d.message):""
      const fixed=raw.replace(/^http:/,"https:")
      setImg(fixed)
      setHref(fixed)
    } finally {
      setLoading(false)
    }
  }
  useEffect(()=>{load()},[])
  return(
    <div className="wrap">
      <div className="card">
        <div className="row">
          <button onClick={load} disabled={loading}>Get Another Dog</button>
          <span className="mut">{loading?"Loading…":""}</span>
        </div>
        <div className="row">
          <span className="mut">Current image URL:</span>
          {href? <a className="link" href={href} target="_blank" rel="noreferrer">{href}</a> : <span className="mut">N/A</span>}
        </div>
        {img? <img className="img" src={img} alt="dog" /> : <div className="mut">No image</div>}
      </div>
    </div>
  )
}
const root=ReactDOM.createRoot(document.getElementById("root"))
root.render(<App/>)
</script>
</body>
</html>
